name: stocklock

x-application: &application
  build:
    dockerfile: dockerfile
    target: dev
  env_file:
    - .env
  environment:
    STOCKLOCK_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@stocklock-postgres:5432/${POSTGRES_DB}

services:
  stocklock:
    container_name: stocklock
    <<: *application
    ports:
      - ${SERVICE_PORT}:${SERVICE_PORT}
    volumes:
      - ./stocklock:/base/stocklock
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    container_name: stocklock-migrate
    <<: *application
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    volumes:
      - ./migrations:/base/migrations
    depends_on:
      postgres:
        condition: service_healthy

  expiration:
    container_name: stocklock-expiration
    <<: *application
    command: ["uv", "run", "--no-sync", "python", "-m", "stocklock.infrastructure.workers.expiration"]
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      migrate:
        condition: service_completed_successfully

  retention:
    container_name: stocklock-retention
    <<: *application
    command: ["uv", "run", "--no-sync", "python", "-m", "stocklock.infrastructure.workers.retention"]
    restart: on-failure
    stop_grace_period: 35s
    depends_on:
      migrate:
        condition: service_completed_successfully

  product-cleanup:
    container_name: stocklock-product-cleanup
    <<: *application
    command: ["uv", "run", "--no-sync", "python", "-m", "stocklock.infrastructure.workers.product_cleanup"]
    restart: on-failure
    stop_grace_period: 35s
    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres:
    container_name: stocklock-postgres
    image: postgres:18
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    healthcheck:
      interval: 2s
      retries: 10
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      timeout: 2s
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocklock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stocklock}

volumes:
  pgdata:
